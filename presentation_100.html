<style>
  :root{ --bg:#0f1220; --card:#1a1f35; --ink:#eef1f7; --muted:#9aa3bd;
         --gold:#f4c542; --ok:#3ddc84; --bad:#ff6b6b; --line:#2c3354; --accent:#6ea8fe; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}

       display:flex;flex-direction:column;height:100vh}

  .pill.bad{background:rgba(255,107,107,.15);color:var(--bad)}
  main{flex:1;overflow:auto;padding:22px;display:flex;justify-content:center}
  .slide{max-width:1000px;width:100%}
  .q{font-size:26px;font-weight:700;line-height:1.4;margin:0 0 18px}
  .ans{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .ans .box{flex:1;min-width:240px;background:var(--card);border:1px solid var(--line);
            border-radius:12px;padding:14px 16px}
  .box .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700;letter-spacing:.5px}
  .box.gold .val{color:var(--gold);font-size:20px;font-weight:700}

  .sec-title{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 10px;
             text-transform:uppercase;letter-spacing:1px}
  .seif{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px 16px;margin-bottom:12px}
  .seif.gold{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .seif .ref{display:inline-block;font-weight:800;color:var(--accent);margin-bottom:8px}
  .seif.gold .ref{color:var(--gold)}
  .seif .tag{font-size:11px;color:#0f1220;background:var(--gold);padding:2px 8px;
             border-radius:10px;margin-inline-start:8px;font-weight:800}
  .seif .txt{font-size:16px;line-height:1.7;color:#dfe4f3}
  footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;
         align-items:center;justify-content:space-between;background:#141830}
  button{background:var(--accent);color:#0f1220;border:0;padding:9px 18px;border-radius:8px;
         font-size:15px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.35;cursor:default}
  .hint{font-size:12px;color:var(--muted)}

<script>
const DATA = [{"id": 14, "q": "האם אומרים מזמור לתודה בשבת?", "gold": "לא", "rag": "מותר, (סימן 14 סעיף 5)", "gold_ref": "14:5", "ctx_hit": 1, "contains": 0, "retrieved": [{"ref": "14:5", "text": "בשבת וביום טוב אין אומרים מזמור לתודה, מפני שקרבן תודה בא בנדבה, ואין מביאים נדרים ונדבות בשבת וביום טוב. גם אין אומרים אותו בחל המועד פסח, מפני שאין קרבן תודה בא אז, לפי שעם התודה צריכין להביא עשרה לחמי חמץ. ולא בערב פסח כי שמא לא יוכלו לאכלם עד זמן אסור חמץ ויצטרכו לשרפן. ולא בערב יום הכפורים, מפני שממעט זמן אכילתם ומביא קדשים לידי פסול (נ\"א).", "is_gold": true}, {"ref": "131:2", "text": "אין אומרים מזמור לתודה, ולא תחנון, ולא למנצח. גם אין אומרים אבינו מלכנו. ורק כשחל יום הכפורים בשבת, אז אומרים ערב יום הכפורים בשחרית אבינו מלכנו (תרד).", "is_gold": false}, {"ref": "113:1", "text": "אין אומרים מזמור לתודה ולא למנצח (תכ\"ט).", "is_gold": false}]}, {"id": 35, "q": "האם שיכור שאינו יכול לדבר כראוי רשאי להתפלל?", "gold": "אסור", "rag": "אסור, (צ\"ט)", "gold_ref": "18:22", "ctx_hit": 1, "contains": 1, "retrieved": [{"ref": "18:22", "text": "שכור אם אינו יכול לדבר לפני אדם גדול ונכבד אסור להתפלל. ואם עבר והתפלל תפלתו תועבה, וצריך לחזר ולהתפלל כשיסור יינו מעליו, ואם עבר זמן תפלה, משלים אותה בתפלה שלאחריה כדין שוגג ואנס לקמן סימן כ\"א. (צ\"ט). (דין תפילה באשה נדה, עין לקמן סוף סימן קנ\"ג).", "is_gold": true}, {"ref": "8:3", "text": "יש אומרים, שאפלו אם קם בחצות הלילה אסור לו לטעם קדם שיתפלל, וכן נכון להחמיר. אך אם חלש לבו, מתר לו לאכל ולשתות איזה דבר לחזק גופו לתורה.", "is_gold": false}, {"ref": "56:7", "text": "ואם לא נזכר תוך כדי דבור, צריך לברך מחדש ברכת שהכל אם הוא רוצה לשתת כוס זה. ואם היה בדעתו לשתות גם יין אחר, יקח יין וישתה מיד, ואינו צריך ברכה שניה כל שלא הפסיק בדבור (עין לעיל סימן נ' סעיף ד' וסעיף ה'). ואפלו טעם תחלה מן הכוס ועל ידי טעימתו נודע לו שהוא מים או שכר מכל מקום לא הוי הפסק בדיעבד (ולענין קידוש ע\"ל ס' עז ס' יב).", "is_gold": false}]}, {"id": 47, "q": "מתי אומר השליח ציבור עננו בתענית ציבור?", "gold": "קודם רפאנו", "rag": "מותר (מספר: 8) [סימן 20 סעיף 8].", "gold_ref": "20:8", "ctx_hit": 1, "contains": 0, "retrieved": [{"ref": "20:8", "text": "בתענית צבור ויש בבית הכנסת עשרה שמתענים ומשלימים, אומר השליח צבור בשחרית ובמנחה עננו קדם רפאנו. ואם טעה ולא אמרו, אם נזכר קודם שאמר את השם, מן הברכה רופא חולי, חוזר ואומר עננו ורפאנו. אבל לא נזכר עד לאחר שאמר את השם, גומר הברכה רופא חולי עמו ישראל, ואומר עננו בתוך ברכת שומע תפלה, וחותם שומע תפלה כמו יחיד. ואם שכחו גם שם, אומרו לאחר סיום התפלה בלא חתימה.", "is_gold": true}, {"ref": "19:14", "text": "ביום התענית בין בתענית צבור בין בתענית יחיד, אומרים בתפלת המנחה בברכת שמע קולנו, עננו, וכשמגיע לבכל עת צרה וצוקה יסים כי אתה שומע וכו'. ואם שכח מלומר עננו, אם לא נזכר עד לאחר שאמר את השם מברכת שומע תפלה, אינו חוזר ואומרו, אלא לאחר שגמר כל התפלה, לאחר אלהי נצר קודם שיעקר רגליו, אומרו עד בכל עת צרה וצוקה ומסים יהיו לרצון וכו', ואם לא נזכר עד לאחר שעקר רגליו, אינו אומרו עוד כלל (תקס\"ה).", "is_gold": false}, {"ref": "20:6", "text": "קודם שאומר השליח צבור שים שלום, אומר אלהינו ואלהי אבותינו. ברכנו וכו', וכשאומר \"וישמרך\" אומרים הקהל כן יהי רצון ולא יאמרו אמן. וכן כשאומר ויחנך ושלום. ואין אומרים אותו רק בשחרית ובמוסף, ולא במנחה. רק בתענית צבור, שאומרים גם במנחה שים שלום, אז אומר השליח צבור גם אלהינו ואלהי אבותינו. ואין אומרים אותו בבית אבל, ולא בתשעה באב בשחרית (קכ\"א קכ\"ז).", "is_gold": false}]}, {"id": 49, "q": "אם לא התפלל שחרית, מתי משלים אותה?", "gold": "אחרי מנחה", "rag": "מותר להשלים לאחר תפילת מנחה (21:4), כל עוד לא עבר זמן תפילת שחרית (21:1).", "gold_ref": "21:1", "ctx_hit": 1, "contains": 0, "retrieved": [{"ref": "21:4", "text": "אך ביום שיש בו מוסף, אם לא התפלל שחרית, יכול להשלימה לאחר מנחה, (דכיון דזמן תפלת מוסף, בדיעבד עד הלילה, כמו מנחה אם כן לא עבר שתי זמני תפלות) ולאחר תפלת מוסף, אינו יכול להשלים תפלת שחרית, (דכיון שמזכיר בה קרבן מוסף, אינה ראויה שתעלה לתפלת שחרית. פרי מגדים סימן ק\"ח, אברהם סעיף קטן ו'). אך עם עדין לא עבר זמן תפלת שחרית, יכול להתפלל שחרית, אף על פי שכבר התפלל מוסף.", "is_gold": false}, {"ref": "21:1", "text": "כבר נתבאר בסימן י\"ח שאם עבר זמן תפלה במזיד, אין לו תשלומין אבל אם מחמת שגגה או אנס לא התפלל, או שטעה בתפלתו בדבר שצריך לחזר ולהתפלל יכול להשלימה לאחר תפלה הסמוכה לה, וצריך שיתפלל דוקא תפלה שהיא זמנה, ואחר כך תפלת התשלומין, דהינו אם לא התפלל שחרית, אזי כשיגיע זמן תפלת מנחה, יתפלל מתחלה, תפלה לשם מנחה ואומר תחנון, ואחר כך מיד אומר אשרי, ומתפלל עוד שמנה עשרה בשביל שחרית. ואם לא התפלל מנחה, אזי יתפלל תחלה ערבית, וישהה רק כדי הלוך ד' אמות ואינו אומר אשרי אלא מיד יתפלל תפלת שמנה עשרה בשביל מנחה, ואם לא התפלל ערבית, אזי לאחר תפלת שחרית, יאמר תחנון ואשרי, ויתפלל תפלת שמנה עשרה לשם ערבית ואחר כך יאמר למנצח ובא לציון וכו', ואסור לו לאכל עד שיתפלל גם תפלה זו, שהיא לשם ערבית.", "is_gold": true}, {"ref": "76:22", "text": "במה דברים אמורים, בתפלות ערבית שחרית ומנחה. אבל בתפלת מוסף, אם התפלל במקומה תפלה אחרת, לא יצא, הואיל ולא הזכיר קרבן מוסף. וכן אם במקום ערבית או שחרית או מנחה התפלל מוסף, לא יצא, הואיל והזכיר קרבן מוסף, ואמר שקר לפני המקום ברוך הוא (רסח).", "is_gold": false}]}, {"id": 54, "q": "לאיזה צד נוטים בנפילת אפים בשחרית?", "gold": "ימין", "rag": "נטה לצד ימין (2)", "gold_ref": "22:2", "ctx_hit": 1, "contains": 1, "retrieved": [{"ref": "22:2", "text": "בשחרית, כיון שיש תפלין בשמאלו, נוטין על צד ימין, משום כבוד התפלין, ובמנחה, נוטין על צד שמאל.", "is_gold": true}, {"ref": "22:4", "text": "אין נפילת אפים כי אם במקום שיש שם ספר תורה, אבל במקום שאין שם ספר תורה אף על פי שיש שם שאר ספרי קדש, אין נופלין על פניהם, אלא אומרים את המזמור בלי נפילת אפים. וכשמתפללים בעזרת בית הכנסת, ופתח בית הכנסת פתוח, נחשב כאלו היה שם ספר תורה.", "is_gold": false}, {"ref": "22:3", "text": "נפילת אפים יש להיות מישב, אך בשעת הדחק יוכל להיות גם מעמד. לאחר תחנון אומרים ואנחנו לא נדע, ויש לאמרו בישיבה, ואחר כך עומדין ואומרים מה נעשה וכו'.", "is_gold": false}]}, {"id": 58, "q": "האם מי שעולה לתורה צריך להתעטף בטלית?", "gold": "כן", "rag": "מותר (סימן 23 סעיף 2)", "gold_ref": "23:2", "ctx_hit": 1, "contains": 0, "retrieved": [{"ref": "23:2", "text": "העולה לתורה, יש לו להתעטף בטלית מציצת, ועולה בדרך קצרה לו, ויורד בדרך ארכה. ואם שני הדרכים שוים, ע
